name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      # build.js без зависимостей: склеивает src/* в dist/index.html и копирует звуки в dist/sounds
      - run: node build.js
      - run: mkdir -p _site && cp -r dist/index.html dist/sounds _site/
      # макеты интерфейса: docs/mockups/* -> /mockups/*
      - run: cp -r docs/mockups _site/mockups
      # игра на Unity (сборка Web, Unity/Assets/Game/Editor/WebBuild.cs): web/unity/* -> /unity/*
      - run: cp -r web/unity _site/unity
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
